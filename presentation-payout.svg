<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1a202c">След выплат продавцам — синтетический цикл 2026-W40</text>

  <!-- row 1: documents -->
  <rect x="20" y="60" width="280" height="64" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="160" y="86" text-anchor="middle" font-size="15" fill="#1a202c">Отчёт реализации</text>
  <text x="160" y="108" text-anchor="middle" font-size="13" fill="#4a5568">платформа</text>
  <rect x="340" y="60" width="280" height="64" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="480" y="86" text-anchor="middle" font-size="15" fill="#1a202c">Электронная заявка</text>
  <text x="480" y="108" text-anchor="middle" font-size="13" fill="#4a5568">продавец</text>
  <rect x="660" y="60" width="280" height="64" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="800" y="86" text-anchor="middle" font-size="15" fill="#1a202c">Платёжное поручение</text>
  <text x="800" y="108" text-anchor="middle" font-size="13" fill="#4a5568">банк</text>
  <line x1="300" y1="92" x2="336" y2="92" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="92" x2="656" y2="92" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>

  <!-- down to batch -->
  <line x1="480" y1="124" x2="480" y2="160" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>

  <!-- row 2: batch + reconcile -->
  <rect x="180" y="164" width="280" height="64" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="320" y="190" text-anchor="middle" font-size="15" fill="#1a202c">Merkle-батч цикла</text>
  <text x="320" y="212" text-anchor="middle" font-size="13" fill="#4a5568">11 листьев: 6 начислений + 5 перечислений</text>
  <rect x="500" y="164" width="280" height="64" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="640" y="190" text-anchor="middle" font-size="15" fill="#1a202c">Сверка потоков</text>
  <text x="640" y="212" text-anchor="middle" font-size="13" fill="#4a5568">начисления vs перечисления</text>
  <line x1="460" y1="196" x2="496" y2="196" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>

  <!-- down to results -->
  <line x1="350" y1="228" x2="190" y2="264" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="228" x2="640" y2="264" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="780" y1="228" x2="880" y2="264" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>

  <!-- row 3: results -->
  <rect x="60" y="268" width="260" height="64" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="190" y="294" text-anchor="middle" font-size="15" font-weight="600" fill="#c53030">ФЛАГ 003</text>
  <text x="190" y="316" text-anchor="middle" font-size="13" fill="#4a5568">расхождение −2 500 ₽</text>
  <rect x="350" y="268" width="260" height="64" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="480" y="294" text-anchor="middle" font-size="15" font-weight="600" fill="#c53030">ФЛАГ 006</text>
  <text x="480" y="316" text-anchor="middle" font-size="13" fill="#4a5568">начисление без пары</text>
  <rect x="640" y="268" width="260" height="64" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="770" y="294" text-anchor="middle" font-size="15" font-weight="600" fill="#276749">OK</text>
  <text x="770" y="316" text-anchor="middle" font-size="13" fill="#4a5568">4 выплаты сошлись</text>

  <!-- row 4: proof -->
  <line x1="480" y1="332" x2="480" y2="360" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="180" y="364" width="600" height="56" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="480" y="388" text-anchor="middle" font-size="15" fill="#1a202c">Merkle-proof: продавец проверяет свою выплату сам,</text>
  <text x="480" y="409" text-anchor="middle" font-size="13" fill="#4a5568">без доступа к системам банка; чужая выплата недоступна</text>
</svg>
